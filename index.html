<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲量予報 - Cloud Cover Forecast</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- .om 読み込みライブラリ（本番向けではない旨の注記があるため版を固定） -->
    <script type="importmap">
    {
        "imports": {
            "@openmeteo/file-reader": "https://cdn.jsdelivr.net/npm/@openmeteo/file-reader@0.0.20/dist/esm/index.browser.js",
            "@openmeteo/file-format-wasm": "https://cdn.jsdelivr.net/npm/@openmeteo/file-format-wasm@0.0.20/dist/om_file_format.web.js"
        }
    }
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 320px;
        }

        button, select, option {
            font-size: 14px;
            height: 30px;
            line-height: 30px;
            padding: 0;
        }
        
        .control-panel {
            padding: 10px;
            background: white;
            /* 検索候補を Leaflet のコントロール（z-index 1000）より上に出す */
            z-index: 1100;
            width: 320px;
            max-width: 100%;
            box-sizing: border-box;
        }
        
        .control-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .control-panel h1 {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        
        #title-link {
            text-decoration: none;
            color: #333;
        }
        
        #update-time {
            font-size: 12px;
            color: #666;
            margin: 0;
        }
        
        #update-time strong {
            color: #333;
        }
        
        .time-select-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .time-select-btn {
            width: 30px;
            height: 30px;
            line-height: 30px;
            padding: 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .time-select-btn:hover {
            background: #f0f0f0;
        }
        
        .time-select-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .time-select {
            flex: 1;
            min-width: 0;
            width: 185px;
            height: 30px;
            padding: 0 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }
        
        .maps-container {
            display: flex;
            flex-direction: column;
            width: 320px;
            max-width: 100%;
        }
        
        .map-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 320px;
            border-bottom: 1px solid #ddd;
        }
        
        .map-wrapper:last-child {
            border-bottom: none;
        }
        
        .map-label {
            padding: 10px;
            background: #f5f5f5;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #ddd;
        }
        
        .map {
            width: 300px;
            height: 200px;
            margin: 0 auto;
            /* 長押しでピンを置くので、iOS の長押しメニューを出さない */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* 場所検索（スマホは🔍ボタンで開閉） */
        .search-form {
            display: none;
            position: relative;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }
        .search-form.open {
            display: flex;
        }
        .search-input {
            flex: 1;
            min-width: 0;
            height: 30px;
            padding: 0 8px;
            font-size: 16px; /* 16px 未満だと iOS が入力時に拡大する */
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .search-submit {
            padding: 0 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }
        .search-status {
            width: 100%;
            font-size: 12px;
            color: #666;
        }
        .search-results {
            position: absolute;
            top: 35px;
            left: 0;
            right: 0;
            max-height: 50vh;
            overflow-y: auto;
            list-style: none;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .search-results button {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            height: auto;
            min-height: 36px;
            padding: 6px 10px;
            line-height: 1.4;
            text-align: left;
            border: none;
            border-bottom: 1px solid #eee;
            background: white;
            cursor: pointer;
        }
        .search-results li:last-child button {
            border-bottom: none;
        }
        .search-results button:hover {
            background: #f0f0f0;
        }
        .search-results small {
            flex-shrink: 0;
            color: #888;
        }
        
        /* ピンを置いた地点の情報（1行） */
        .pin-info {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 13px;
            color: #333;
        }
        .pin-info[hidden] {
            display: none;
        }
        .pin-name {
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .pin-values {
            flex-shrink: 0;
            margin-left: auto;
            font-variant-numeric: tabular-nums;
        }
        .pin-clear-btn {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            line-height: 22px;
            font-size: 16px;
            color: #666;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }
        
        .pin-marker {
            background: none;
            border: none;
        }
        .map-attribution {
            margin-top: 15px;
            padding: 0 0 10px 0;
            font-size: 12px;
            line-height: 1.6;
            color: #666;
        }
        .map-attribution .notice {
            margin-top: 4px;
            font-size: 10.5px;
            line-height: 1.5;
        }
        
        /* 格子の境界をぼかさない */
        .cloud-grid-tile {
            image-rendering: pixelated;
        }
        
        /* 白地図レイヤーを階調逆転 */
        .inverted-blank-tile {
            filter: invert(1);
            mix-blend-mode: lighten;
        }
        
        /* 地図ラベル用のスタイル */
        .leaflet-control-map-label {
            background: rgba(255, 255, 255, 0.8);
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            text-align: right;
            color: #666;
        }
        .leaflet-control-map-label small {
            font-size: 10px;
            margin: 0 0 0 5px;
        }

        /* PC: 3つの地図を横に並べ、画面幅に応じて 300×200 の最大2倍まで拡大する */
        @media (min-width: 1000px) {
            :root {
                --map-gap: 12px;
                --map-width: min(600px, calc((100vw - 2 * var(--map-gap) - 40px) / 3));
                --maps-width: calc(3 * var(--map-width) + 2 * var(--map-gap));
            }

            .control-panel {
                width: var(--maps-width);
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                column-gap: 24px;
                row-gap: 8px;
                padding: 12px 0;
            }
            
            .time-select {
                width: 220px;
                flex: none;
            }
            
            /* PCは検索欄を常に表示 */
            .search-toggle-btn {
                display: none;
            }
            .search-form {
                display: flex;
                flex: 0 1 360px;
                margin-top: 0;
            }
            .search-status {
                position: absolute;
                top: 35px;
                left: 0;
                right: 0;
                padding: 6px 10px;
                background: white;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            
            .pin-info {
                flex: 1 1 280px;
                margin-top: 0;
            }

            .control-panel-header {
                margin-bottom: 0;
                gap: 16px;
            }

            .maps-container {
                flex-direction: row;
                flex-wrap: wrap;
                gap: var(--map-gap);
                width: var(--maps-width);
            }

            .map-wrapper {
                width: var(--map-width);
                max-width: none;
                border-bottom: none;
            }

            .map {
                width: var(--map-width);
                height: calc(var(--map-width) * 2 / 3);
            }

            .map-attribution {
                width: 100%;
                margin-top: 8px;
            }
            
            /* PCは幅に余裕があるので、出典2つは1行に並べる */
            .map-attribution .credit {
                display: inline;
            }
            .map-attribution .credit + .credit {
                margin-left: 1.5em;
            }
        }
        </style>
</head>
<body>
    <div class="control-panel">
        <div class="control-panel-header">
            <h1><a id="title-link" href="https://yager.github.io/cloud-cover-forecast/">雲量予想</a></h1>
            <div id="update-time">データ取得中...</div>
        </div>
        <div class="time-select-container">
            <button id="time-prev-btn" class="time-select-btn" type="button">◀︎</button>
            <select id="time-select" class="time-select">
                <option>データ取得中...</option>
            </select>
            <button id="time-next-btn" class="time-select-btn" type="button">▶︎</button>
            <button id="search-toggle-btn" class="time-select-btn search-toggle-btn" type="button" aria-label="場所を検索" aria-controls="search-form" aria-expanded="false">🔍</button>
        </div>
        <form id="search-form" class="search-form" role="search">
            <input id="search-input" class="search-input" type="search" placeholder="地名・住所・緯度経度" enterkeyhint="search" autocomplete="off">
            <button class="search-submit" type="submit">検索</button>
            <p id="search-status" class="search-status" hidden></p>
            <ul id="search-results" class="search-results" hidden></ul>
        </form>
        <div id="pin-info" class="pin-info" hidden>
            <span id="pin-name" class="pin-name"></span>
            <span id="pin-values" class="pin-values"></span>
            <button id="pin-clear-btn" class="pin-clear-btn" type="button" aria-label="ピンを消す">×</button>
        </div>
    </div>
    
    <div class="maps-container">
        <div class="map-wrapper">
            <div id="map-upper" class="map"></div>
        </div>
        <div class="map-wrapper">
            <div id="map-middle" class="map"></div>
        </div>
        <div class="map-wrapper">
            <div id="map-lower" class="map"></div>
        </div>
        <div class="map-attribution">
            <div class="credit">地図・場所検索: <a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a></div>
            <div class="credit">雲量: 気象庁MSM / データ <a href="https://open-meteo.com/">Open-Meteo</a> (<a href="https://creativecommons.org/licenses/by/4.0/deed.ja">CC BY 4.0</a>)</div>
            <div class="notice">気象庁メソモデル（MSM）の数値計算結果を格子ごとに色分けしたものです。予報ではなく、大きな誤差を含むことがあります。</div>
        </div>
    </div>
    
    <!-- SunCalc JS -->
    <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script type="module">
        import { PinController, setupSearch, formatLatLng } from './pin.js';
        
        // マップオブジェクト
        const maps = {
            lower: null,
            middle: null,
            upper: null
        };
        
        // 行きたい地点のピンと、雲量データのソース（init で作る）
        let pinController = null;
        let cloudSource = null;
        
        // 日の出・日の入りを計算する既定の地点（ピンが無いとき）
        const DEFAULT_SUN_POINT = { lat: 35.844535, lng: 139.746094 };
        
        // URLパラメータを読み取る関数
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const lat = params.get('lat');
            const lng = params.get('lng');
            const z = params.get('z');
            
            // pin=緯度,経度（任意で pinname=表示名）
            let pin = null;
            const pinParts = (params.get('pin') || '').split(',').map(parseFloat);
            if (pinParts.length === 2 && pinParts.every(Number.isFinite)
                && Math.abs(pinParts[0]) <= 90 && Math.abs(pinParts[1]) <= 180) {
                pin = { lat: pinParts[0], lng: pinParts[1], name: params.get('pinname') };
            }
            
            return {
                lat: lat ? parseFloat(lat) : null,
                lng: lng ? parseFloat(lng) : null,
                z: z ? parseFloat(z) : null,
                pin
            };
        }
        
        // URLを更新する関数
        function updateUrl(center, zoom) {
            const params = new URLSearchParams();
            params.set('lat', center.lat.toFixed(6));
            params.set('lng', center.lng.toFixed(6));
            params.set('z', zoom.toString());
            
            const pin = pinController && pinController.pin;
            if (pin) {
                params.set('pin', formatLatLng(pin.lat, pin.lng).replace(' ', ''));
                if (pin.name !== formatLatLng(pin.lat, pin.lng)) {
                    params.set('pinname', pin.name);
                }
            }
            
            const newUrl = window.location.pathname + '?' + params.toString();
            history.replaceState(null, '', newUrl);
        }
        
        // マップを初期化する関数
        function initMaps() {
            // URLパラメータから初期値を取得
            const urlParams = getUrlParams();
            
            // 初期表示は関東の範囲。地図の大きさ（スマホ/PC）に応じて小数ズームで合わせる。
            // スマホ（300×200）でちょうどズーム7になる範囲を、少しだけ内側に縮めてある
            const defaultBounds = L.latLngBounds([34.895, 137.840], [36.659, 141.103]);
            const mapOptions = {
                zoomSnap: 0.25
            };
            
            maps.lower = L.map('map-lower', mapOptions);
            maps.middle = L.map('map-middle', mapOptions);
            maps.upper = L.map('map-upper', mapOptions);
            
            const initialZoom = urlParams.z !== null ? urlParams.z : maps.lower.getBoundsZoom(defaultBounds);
            const initialCenter = urlParams.lat !== null && urlParams.lng !== null
                ? L.latLng(urlParams.lat, urlParams.lng)
                : defaultBounds.getCenter();
            
            Object.values(maps).forEach((map) => map.setView(initialCenter, initialZoom));
            
            // 国土地理院の地図タイルを各マップに追加（写真地図を使用）
            const baseTileUrl = 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg';
            const blankTileUrl = 'https://cyberjapandata.gsi.go.jp/xyz/blank/{z}/{x}/{y}.png';
            
            // 写真地図レイヤーを追加（背景）
            const baseTileLayer = L.tileLayer(baseTileUrl, {
                maxZoom: 18
            }).addTo(maps.lower);
            
            L.tileLayer(baseTileUrl, {
                maxZoom: 18
            }).addTo(maps.middle);
            
            L.tileLayer(baseTileUrl, {
                maxZoom: 18
            }).addTo(maps.upper);
            
            // 白地図を階調逆転して透過率30%で重ねる（不透明度30%）
            const blankTileLayer = L.tileLayer(blankTileUrl, {
                maxZoom: 18,
                className: 'inverted-blank-tile'
            }).addTo(maps.lower);
            
            L.tileLayer(blankTileUrl, {
                maxZoom: 18,
                className: 'inverted-blank-tile'
            }).addTo(maps.middle);
            
            L.tileLayer(blankTileUrl, {
                maxZoom: 18,
                className: 'inverted-blank-tile'
            }).addTo(maps.upper);
            
            
            // 各マップにラベルを追加（右上）
            const labelUpper = L.control({position: 'topright'});
            labelUpper.onAdd = function() {
                const div = L.DomUtil.create('div', 'leaflet-control-map-label');
                div.innerHTML = '上層<small>5500m付近〜</small>';
                return div;
            };
            labelUpper.addTo(maps.upper);
            
            const labelMiddle = L.control({position: 'topright'});
            labelMiddle.onAdd = function() {
                const div = L.DomUtil.create('div', 'leaflet-control-map-label');
                div.innerHTML = '中層<small>1500〜5500m付近</small>';
                return div;
            };
            labelMiddle.addTo(maps.middle);
            
            const labelLower = L.control({position: 'topright'});
            labelLower.onAdd = function() {
                const div = L.DomUtil.create('div', 'leaflet-control-map-label');
                div.innerHTML = '下層<small>〜1500m付近</small>';
                return div;
            };
            labelLower.addTo(maps.lower);
            
            // マップのサイズを再計算（複数マップの場合に必要）
            setTimeout(() => {
                maps.lower.invalidateSize();
                maps.middle.invalidateSize();
                maps.upper.invalidateSize();
            }, 100);
            
            // 3つのマップのズームレベルと位置を連動させる
            let syncing = false; // 同期中フラグ（無限ループを防ぐ）
            
            function syncMaps(sourceMap, targetMap1, targetMap2) {
                if (syncing) return; // 既に同期中なら何もしない
                syncing = true;
                
                const center = sourceMap.getCenter();
                const zoom = sourceMap.getZoom();
                
                // 他の2つのマップを同期
                targetMap1.setView(center, zoom);
                targetMap2.setView(center, zoom);
                
                // URLを更新
                updateUrl(center, zoom);
                
                setTimeout(() => {
                    syncing = false;
                }, 100);
            }
            
            // 下層地図の変更を監視して中層・上層に反映
            maps.lower.on('moveend', function() {
                if (!syncing) {
                    syncMaps(maps.lower, maps.middle, maps.upper);
                }
            });
            
            maps.lower.on('zoomend', function() {
                if (!syncing) {
                    syncMaps(maps.lower, maps.middle, maps.upper);
                }
            });
            
            // 中層地図の変更を監視して下層・上層に反映
            maps.middle.on('moveend', function() {
                if (!syncing) {
                    syncMaps(maps.middle, maps.lower, maps.upper);
                }
            });
            
            maps.middle.on('zoomend', function() {
                if (!syncing) {
                    syncMaps(maps.middle, maps.lower, maps.upper);
                }
            });
            
            // 上層地図の変更を監視して下層・中層に反映
            maps.upper.on('moveend', function() {
                if (!syncing) {
                    syncMaps(maps.upper, maps.lower, maps.middle);
                }
            });
            
            maps.upper.on('zoomend', function() {
                if (!syncing) {
                    syncMaps(maps.upper, maps.lower, maps.middle);
                }
            });
        }
        
        // UTC時刻をJSTに変換して文字列として返す
        function utcToJSTString(utcString) {
            const utcDate = new Date(utcString);
            return utcDate.toLocaleString('ja-JP', {
                timeZone: 'Asia/Tokyo',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            }).replace(/\//g, '-');
        }
        
        // UTC時刻をJSTに変換して文字列として返す（年なし、プルダウン用）
        function utcToJSTStringForSelect(utcString) {
            const utcDate = new Date(utcString);
            return utcDate.toLocaleString('ja-JP', {
                timeZone: 'Asia/Tokyo',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // 日の出・日の入りの時間を計算（地図の中心座標を使用）
        function getSunsetSunriseTimes(date, lat, lon) {
            const times = SunCalc.getTimes(date, lat, lon);
            return {
                sunrise: times.sunrise,
                sunset: times.sunset
            };
        }
        
        // 時刻が日の出・日の入りに該当するかチェック（±30分の範囲内）
        function isSunsetSunriseTime(time, lat, lon) {
            const date = new Date(time);
            const sunTimes = getSunsetSunriseTimes(date, lat, lon);
            const tolerance = 30 * 60 * 1000; // 30分（ミリ秒）
            
            const timeMs = date.getTime();
            const sunriseMs = sunTimes.sunrise.getTime();
            const sunsetMs = sunTimes.sunset.getTime();
            
            return Math.abs(timeMs - sunriseMs) <= tolerance || Math.abs(timeMs - sunsetMs) <= tolerance;
        }
        
        // 日の出・日の入りの時間を取得（該当する場合）
        function getSunsetSunriseLabel(time, lat, lon) {
            const date = new Date(time);
            const sunTimes = getSunsetSunriseTimes(date, lat, lon);
            const tolerance = 30 * 60 * 1000; // 30分（ミリ秒）
            
            const timeMs = date.getTime();
            const sunriseMs = sunTimes.sunrise.getTime();
            const sunsetMs = sunTimes.sunset.getTime();
            
            if (Math.abs(timeMs - sunriseMs) <= tolerance) {
                const sunriseTime = sunTimes.sunrise.toLocaleString('ja-JP', {
                    timeZone: 'Asia/Tokyo',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                return ` /日の出 ${sunriseTime}`;
            } else if (Math.abs(timeMs - sunsetMs) <= tolerance) {
                const sunsetTime = sunTimes.sunset.toLocaleString('ja-JP', {
                    timeZone: 'Asia/Tokyo',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                return ` /日の入 ${sunsetTime}`;
            }
            return '';
        }
        
        // 日時プルダウンのラベル。日の出・日の入りはピンの地点（無ければ既定の地点）で判定
        function timeLabel(utcKey) {
            const point = (pinController && pinController.pin) || DEFAULT_SUN_POINT;
            let label = utcToJSTStringForSelect(utcKey);
            if (isSunsetSunriseTime(utcKey, point.lat, point.lng)) {
                label += getSunsetSunriseLabel(utcKey, point.lat, point.lng);
            }
            return label;
        }
        
        function refreshTimeLabels() {
            for (const option of document.getElementById('time-select').options) {
                if (option.value) option.textContent = timeLabel(option.value);
            }
        }
        
        // 基準時刻と対象時刻の一覧から日時プルダウンを作成
        function setupTimeSelect(data) {
            const select = document.getElementById('time-select');
            select.innerHTML = ''; // 既存のオプションをクリア
            
            if (data.times) {
                const tileKeys = [...data.times];
                // 時刻でソート（時系列昇順）
                tileKeys.sort((a, b) => new Date(a) - new Date(b));
                
                tileKeys.forEach((utcKey) => {
                    const option = document.createElement('option');
                    option.value = utcKey;
                    option.textContent = timeLabel(utcKey);
                    select.appendChild(option);
                });
                
                // 現在時刻の次にくる時間を選択
                if (tileKeys.length > 0) {
                    const now = new Date();
                    // 現在時刻より後の時刻を探す
                    const nextTime = tileKeys.find(utcKey => {
                        const time = new Date(utcKey);
                        return time > now;
                    });
                    
                    // 現在時刻より後の時刻があればそれを選択、なければ最初の時刻を選択
                    if (nextTime) {
                        select.value = nextTime;
                    } else {
                        select.value = tileKeys[0];
                    }
                }
            }
            
            // basetimeをJSTに変換して表示（年なし）
            if (data.baseTime) {
                const jstString = utcToJSTStringForSelect(data.baseTime);
                document.getElementById('update-time').innerHTML = 
                    `<strong>基準時刻:</strong> ${jstString} (JST)`;
            }
        }
        
        // 気象庁MSMの数値計算結果（Open-Meteo の .om）をブラウザで描くソース
        // onFrame: 表示するコマが切り替わったときに呼ぶ
        async function createMsmSource(onFrame) {
            const msm = await import('./msm.js');
            const source = new msm.MsmOmSource();
            const layers = {};
            let requestedTime = null;
            let currentFrame = null;
            
            ['lower', 'middle', 'upper'].forEach((type) => {
                layers[type] = new msm.CloudGridLayer().addTo(maps[type]);
            });
            
            return {
                loadIndex: () => source.loadIndex(),
                
                // 表示中のコマで、地点に最も近い格子の値。
                // 読み込み前は undefined、格子の範囲外は null、欠測の層は null
                valueAt(lat, lng) {
                    if (!currentFrame) return undefined;
                    const cell = msm.gridIndex(lat, lng);
                    if (!cell) return null;
                    const i = cell.iy * msm.GRID.nx + cell.ix;
                    const value = (type) => currentFrame[type][i] === msm.MISSING ? null : currentFrame[type][i];
                    return { upper: value('upper'), middle: value('middle'), lower: value('lower') };
                },
                
                async show(time) {
                    requestedTime = time;
                    let frame;
                    try {
                        frame = await source.loadFrame(time);
                    } catch (error) {
                        console.error(`Failed to load MSM frame ${time}:`, error);
                        return;
                    }
                    // 読み込み中に別の時刻が選ばれていたら捨てる
                    if (requestedTime !== time) return;
                    currentFrame = frame;
                    ['lower', 'middle', 'upper'].forEach((type) => layers[type].setValues(frame[type]));
                    onFrame();
                    
                    // 次のコマを先読み
                    const select = document.getElementById('time-select');
                    const next = select.options[select.selectedIndex + 1];
                    if (next) source.loadFrame(next.value).catch(() => {});
                }
            };
        }
        
        // 操作パネルの「📍地点名 上12 / 中40 / 下80%」
        function updatePinInfo() {
            const info = document.getElementById('pin-info');
            const pin = pinController && pinController.pin;
            info.hidden = !pin;
            if (!pin) return;
            
            document.getElementById('pin-name').textContent = `📍${pin.name}`;
            document.getElementById('pin-name').title = pin.name;
            const values = cloudSource ? cloudSource.valueAt(pin.lat, pin.lng) : undefined;
            let text = '';
            if (values === null) {
                text = '範囲外';
            } else if (values) {
                const fmt = (v) => v === null ? '−' : String(v);
                text = `上${fmt(values.upper)} / 中${fmt(values.middle)} / 下${fmt(values.lower)}%`;
            }
            document.getElementById('pin-values').textContent = text;
        }
        
        // ピン（クリック/長押しで置く・ドラッグで動かす・検索で置く）
        function initPin() {
            pinController = new PinController(maps, () => {
                updatePinInfo();
                refreshTimeLabels();
                updateUrl(maps.lower.getCenter(), maps.lower.getZoom());
            });
            
            const urlPin = getUrlParams().pin;
            if (urlPin) {
                pinController.set(urlPin.lat, urlPin.lng, urlPin.name);
            }
            
            document.getElementById('pin-clear-btn').addEventListener('click', () => pinController.clear());
            
            // スマホは🔍ボタンで検索欄を開閉する
            const form = document.getElementById('search-form');
            const toggle = document.getElementById('search-toggle-btn');
            const input = document.getElementById('search-input');
            toggle.addEventListener('click', () => {
                const open = form.classList.toggle('open');
                toggle.setAttribute('aria-expanded', String(open));
                if (open) input.focus();
            });
            
            setupSearch(
                {
                    form,
                    input,
                    list: document.getElementById('search-results'),
                    status: document.getElementById('search-status')
                },
                () => maps.lower.getCenter(),
                (lat, lng, name) => {
                    form.classList.remove('open');
                    toggle.setAttribute('aria-expanded', 'false');
                    pinController.set(lat, lng, name);
                    maps.lower.setView([lat, lng], maps.lower.getZoom());
                }
            );
        }
        
        // 初期化
        async function init() {
            // title-linkのURLをクエリストリングなしのURLに設定
            const baseUrl = window.location.origin + window.location.pathname;
            const titleLink = document.getElementById('title-link');
            if (titleLink) {
                titleLink.href = baseUrl;
            }
            
            // まずマップを初期化
            initMaps();
            initPin();
            
            cloudSource = await createMsmSource(updatePinInfo);
            
            let index = null;
            try {
                index = await cloudSource.loadIndex();
            } catch (error) {
                console.error('Failed to load cloud data index:', error);
            }
            
            if (index) {
                setupTimeSelect(index);
                
                // 日時プルダウンの変更イベント
                const timeSelect = document.getElementById('time-select');
                const prevBtn = document.getElementById('time-prev-btn');
                const nextBtn = document.getElementById('time-next-btn');
                
                timeSelect.addEventListener('change', function() {
                    cloudSource.show(this.value);
                });
                
                // 前の時刻に移動
                prevBtn.addEventListener('click', function() {
                    const currentIndex = timeSelect.selectedIndex;
                    if (currentIndex > 0) {
                        timeSelect.selectedIndex = currentIndex - 1;
                        timeSelect.dispatchEvent(new Event('change'));
                    }
                });
                
                // 次の時刻に移動
                nextBtn.addEventListener('click', function() {
                    const currentIndex = timeSelect.selectedIndex;
                    if (currentIndex < timeSelect.options.length - 1) {
                        timeSelect.selectedIndex = currentIndex + 1;
                        timeSelect.dispatchEvent(new Event('change'));
                    }
                });
                
                // 初期表示（少し遅延させてマップが完全に初期化されるのを待つ）
                setTimeout(() => {
                    if (timeSelect.value) {
                        cloudSource.show(timeSelect.value);
                    }
                }, 200);
            }
        }
        
        // ページ読み込み時に初期化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
