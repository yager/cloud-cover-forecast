name: Fetch JMA tide data

on:
  schedule:
    # 翌年テキストが出揃う頃。失敗したら手動で再実行。
    - cron: "0 3 15 12 *"
  workflow_dispatch:
    inputs:
      years:
        description: "Comma-separated years (empty = script default)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch tide tables
        run: |
          if [ -n "${{ inputs.years }}" ]; then
            python3 scripts/fetch_tide_data.py --years "${{ inputs.years }}"
          else
            python3 scripts/fetch_tide_data.py
          fi

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/tide && [ -z "$(git ls-files --others --exclude-standard -- data/tide)" ]; then
            echo "No tide data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tide
          git commit -m "$(cat <<'EOF'
          Update bundled JMA tide table data.

          EOF
          )"
          git push
